<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rabiul Garments</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 0.5rem);
        }
        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f3f4f6;
        }
        /* Container for desktop centering */
        .app-container {
            max-width: 1280px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        @media (min-width: 640px) {
            .app-container {
                padding-left: 1.5rem;
                padding-right: 1.5rem;
            }
        }
        @media (min-width: 1024px) {
            .app-container {
                padding-left: 2rem;
                padding-right: 2rem;
            }
        }
        /* Bottom nav becomes horizontal bar on larger screens */
        .bottom-nav {
            max-width: 1280px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ============================================================
        //  ICONS (same)
        // ============================================================
        const Menu = ({ className = "w-6 h-6", ...props }) => ( <svg className={className} {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" /></svg> );
        const Search = ({ className = "w-6 h-6", ...props }) => ( <svg className={className} {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg> );
        const Heart = ({ className = "w-6 h-6", fill = "none", ...props }) => ( <svg className={className} {...props} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" /></svg> );
        const ShoppingBag = ({ className = "w-6 h-6", ...props }) => ( <svg className={className} {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" /><line x1="3" y1="6" x2="21" y2="6" /><path d="M16 10a4 4 0 0 1-8 0" /></svg> );
        const Home = ({ className = "w-6 h-6", ...props }) => ( <svg className={className} {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg> );
        const Grid = ({ className = "w-6 h-6", ...props }) => ( <svg className={className} {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="3" y="14" width="7" height="7" /><rect x="14" y="14" width="7" height="7" /></svg> );
        const User = ({ className = "w-6 h-6", ...props }) => ( <svg className={className} {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg> );
        const ChevronLeft = ({ className = "w-6 h-6", ...props }) => ( <svg className={className} {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6" /></svg> );
        const Star = ({ className = "w-6 h-6", fill = "none", ...props }) => ( <svg className={className} {...props} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg> );
        const Share2 = ({ className = "w-6 h-6", ...props }) => ( <svg className={className} {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><line x1="8.59" y1="13.51" x2="15.42" y2="17.49" /><line x1="15.41" y1="6.51" x2="8.59" y2="10.49" /></svg> );
        const Plus = ({ className = "w-6 h-6", ...props }) => ( <svg className={className} {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg> );
        const Minus = ({ className = "w-6 h-6", ...props }) => ( <svg className={className} {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12" /></svg> );
        const X = ({ className = "w-6 h-6", ...props }) => ( <svg className={className} {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg> );
        const Truck = ({ className = "w-6 h-6", ...props }) => ( <svg className={className} {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="3" width="15" height="13" /><polygon points="16 8 20 8 23 11 23 16 16 16 16 8" /><circle cx="5.5" cy="18" r="2.5" /><circle cx="18.5" cy="18" r="2.5" /></svg> );

        // ============================================================
        //  MOCK DATA
        // ============================================================
        const BANNERS = [
            { id: 1, image: "https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&q=80&w=1000", title: "SUMMER COLLECTION" },
            { id: 2, image: "https://images.unsplash.com/photo-1503342394128-c104d54dba01?auto=format&fit=crop&q=80&w=1000", title: "NEW ARRIVALS" }
        ];

        const CATEGORIES = [
            { id: 1, name: "Oversized T-Shirts", image: "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?auto=format&fit=crop&q=80&w=200" },
            { id: 2, name: "Joggers", image: "https://images.unsplash.com/photo-1605518216938-7c31b7b14ad0?auto=format&fit=crop&q=80&w=200" },
            { id: 3, name: "Shirts", image: "https://images.unsplash.com/photo-1596755094514-f87e32f85e32?auto=format&fit=crop&q=80&w=200" },
            { id: 4, name: "Co-ord Sets", image: "https://images.unsplash.com/photo-1485230895905-ebd7e82b7931?auto=format&fit=crop&q=80&w=200" },
        ];

        const PRODUCTS = [{
            id: 1,
            brand: "Rabiul Originals",
            name: "Men's Black Oversized Graphic T-shirt",
            price: 499,
            originalPrice: 999,
            discount: 50,
            rating: 4.5,
            reviews: 1245,
            image: "https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb?auto=format&fit=crop&q=80&w=500",
            images: ["https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb?auto=format&fit=crop&q=80&w=800", "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?auto=format&fit=crop&q=80&w=800"],
            isNew: true,
            sizes: ['S', 'M', 'L', 'XL', 'XXL'],
            category: "Oversized T-Shirts"
        }, {
            id: 2,
            brand: "Bewakoof X Rabiul",
            name: "Women's Yellow Quirky Printed T-Shirt",
            price: 399,
            originalPrice: 899,
            discount: 55,
            rating: 4.2,
            reviews: 890,
            image: "https://images.unsplash.com/photo-1529139574466-a303027c028b?auto=format&fit=crop&q=80&w=500",
            images: ["https://images.unsplash.com/photo-1529139574466-a303027c028b?auto=format&fit=crop&q=80&w=800"],
            isNew: false,
            sizes: ['XS', 'S', 'M', 'L'],
            category: "Shirts"
        }, {
            id: 3,
            brand: "Rabiul Garments",
            name: "Unisex Olive Green Cargo Joggers",
            price: 899,
            originalPrice: 1999,
            discount: 55,
            rating: 4.7,
            reviews: 321,
            image: "https://images.unsplash.com/photo-1605518216938-7c31b7b14ad0?auto=format&fit=crop&q=80&w=500",
            images: ["https://images.unsplash.com/photo-1605518216938-7c31b7b14ad0?auto=format&fit=crop&q=80&w=800"],
            isNew: false,
            sizes: ['M', 'L', 'XL'],
            category: "Joggers"
        }, {
            id: 4,
            brand: "Rabiul Garments",
            name: "Classic Blue Denim Jacket",
            price: 1299,
            originalPrice: 2499,
            discount: 48,
            rating: 4.8,
            reviews: 56,
            image: "https://images.unsplash.com/photo-1576871337622-98d48d1cf531?auto=format&fit=crop&q=80&w=500",
            images: ["https://images.unsplash.com/photo-1576871337622-98d48d1cf531?auto=format&fit=crop&q=80&w=800"],
            isNew: true,
            sizes: ['S', 'M', 'L', 'XL'],
            category: "Co-ord Sets"
        }];

        // ============================================================
        //  MAIN APP
        // ============================================================
        function App() {
            const [currentTab, setCurrentTab] = useState('MEN');
            const [view, setView] = useState('home'); // home, product, cart, wishlist, profile
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [cart, setCart] = useState([]);
            const [wishlist, setWishlist] = useState([]);
            const [showSearch, setShowSearch] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState(null);

            // --- ACTIONS ---
            const toggleWishlist = (id) => {
                setWishlist(prev => prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]);
            };

            const addToCart = (product, size) => {
                setCart(prev => {
                    const existing = prev.find(item => item.product.id === product.id && item.size === size);
                    if (existing) {
                        return prev.map(item => item === existing ? { ...item, qty: item.qty + 1 } : item);
                    }
                    return [...prev, { product, size, qty: 1 }];
                });
                setView('cart');
            };

            const updateCartQty = (index, delta) => {
                setCart(prev => {
                    const newCart = [...prev];
                    newCart[index].qty += delta;
                    if (newCart[index].qty <= 0) newCart.splice(index, 1);
                    return newCart;
                });
            };

            const filteredProducts = PRODUCTS.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    p.brand.toLowerCase().includes(searchQuery.toLowerCase());
                const matchCategory = selectedCategory ? p.category === selectedCategory : true;
                return matchSearch && matchCategory;
            });

            // --- VIEWS ---
            const renderHome = () => (
                <div className="pb-20 bg-gray-50 min-h-screen relative">
                    {/* HEADER */}
                    <header className="sticky top-0 z-40 bg-white shadow-sm">
                        <div className="flex items-center justify-between px-4 py-3 app-container">
                            <div className="flex items-center gap-3">
                                <button onClick={() => alert('Menu clicked – navigation sidebar would open')}>
                                    <Menu className="w-6 h-6 text-gray-700" />
                                </button>
                                <h1 className="text-xl font-bold tracking-tight text-gray-900 uppercase font-sans">
                                    Rabiul Garments
                                </h1>
                            </div>
                            <div className="flex items-center gap-4">
                                <button onClick={() => setShowSearch(!showSearch)}>
                                    <Search className="w-6 h-6 text-gray-700" />
                                </button>
                                <button onClick={() => setView('wishlist')}>
                                    <Heart className={`w-6 h-6 ${wishlist.length > 0 ? 'fill-red-500 text-red-500' : 'text-gray-700'}`} />
                                </button>
                                <div className="relative cursor-pointer" onClick={() => setView('cart')}>
                                    <ShoppingBag className="w-6 h-6 text-gray-700" />
                                    {cart.length > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-yellow-400 text-black text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
                                            {cart.length}
                                        </span>
                                    )}
                                </div>
                            </div>
                        </div>

                        {showSearch && (
                            <div className="px-4 pb-3 app-container flex items-center gap-2">
                                <input
                                    type="text"
                                    placeholder="Search for products..."
                                    className="flex-1 border border-gray-300 rounded px-3 py-2 text-sm outline-none focus:border-yellow-400"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    autoFocus
                                />
                                <button onClick={() => { setSearchQuery('');
                                    setShowSearch(false); }} className="text-gray-500">
                                    <X className="w-5 h-5" />
                                </button>
                            </div>
                        )}

                        <div className="flex border-b app-container">
                            {['MEN', 'WOMEN', 'WINTERWEAR'].map(tab => (
                                <button key={tab} onClick={() => setCurrentTab(tab)}
                                    className={`flex-1 py-3 text-sm font-semibold transition-colors ${
                                        currentTab === tab
                                            ? 'text-yellow-500 border-b-2 border-yellow-500'
                                            : 'text-gray-500'
                                    }`}>
                                    {tab}
                                </button>
                            ))}
                        </div>
                    </header>

                    {/* BANNER CAROUSEL */}
                    <div className="w-full h-48 md:h-64 lg:h-80 overflow-hidden relative bg-gray-200 app-container">
                        <img src={BANNERS[0].image} alt="Banner" className="w-full h-full object-cover rounded-lg" />
                        <div className="absolute inset-0 bg-black bg-opacity-20 flex items-center justify-center">
                            <h2 className="text-white text-3xl md:text-5xl font-black tracking-widest text-center uppercase drop-shadow-md">
                                {BANNERS[0].title}
                            </h2>
                        </div>
                    </div>

                    {/* CATEGORIES */}
                    <div className="bg-white py-4 mt-2 app-container">
                        <div className="flex overflow-x-auto gap-4 scrollbar-hide snap-x justify-start md:justify-center">
                            {CATEGORIES.map(cat => (
                                <div key={cat.id} className="flex flex-col items-center min-w-[72px] snap-center cursor-pointer"
                                    onClick={() => {
                                        setSelectedCategory(selectedCategory === cat.name ? null : cat.name);
                                        setSearchQuery('');
                                    }}>
                                    <div className={`w-16 h-16 rounded-full overflow-hidden bg-gray-100 border-2 p-0.5 transition ${selectedCategory === cat.name ? 'border-yellow-400' : 'border-gray-200'}`}>
                                        <img src={cat.image} alt={cat.name} className="w-full h-full object-cover rounded-full" />
                                    </div>
                                    <span className="text-[10px] font-medium text-gray-700 mt-2 text-center leading-tight">
                                        {cat.name}
                                    </span>
                                </div>
                            ))}
                        </div>
                        {selectedCategory && (
                            <div className="mt-2 flex justify-center">
                                <button onClick={() => setSelectedCategory(null)}
                                    className="text-xs bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full font-medium">
                                    Clear filter: {selectedCategory}
                                </button>
                            </div>
                        )}
                    </div>

                    {/* PRODUCT GRID */}
                    <div className="px-4 py-6 app-container">
                        <h3 className="text-center text-lg font-bold text-gray-800 tracking-wide mb-4">
                            {searchQuery ? `Results for "${searchQuery}"` :
                             selectedCategory ? selectedCategory : 'TRENDING DESIGNS'}
                        </h3>
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
                            {filteredProducts.length === 0 ? (
                                <div className="col-span-full text-center py-8 text-gray-500">No products found</div>
                            ) : (
                                filteredProducts.map(product => (
                                    <div key={product.id}
                                        className="bg-white rounded-md overflow-hidden shadow-sm border border-gray-100 flex flex-col cursor-pointer transition-transform active:scale-95 hover:shadow-md"
                                        onClick={() => { setSelectedProduct(product);
                                            setView('product'); }}>
                                        <div className="relative aspect-[3/4] bg-gray-100">
                                            <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
                                            {product.isNew && (
                                                <span className="absolute top-2 left-0 bg-yellow-400 text-black text-[10px] font-bold px-2 py-0.5 uppercase tracking-wider">
                                                    New
                                                </span>
                                            )}
                                            <div className="absolute bottom-2 left-2 bg-white/90 backdrop-blur-sm px-1.5 py-0.5 rounded flex items-center gap-1">
                                                <Star className="w-3 h-3 text-yellow-500 fill-yellow-500" />
                                                <span className="text-[10px] font-bold">{product.rating}</span>
                                            </div>
                                            <button className="absolute top-2 right-2 p-1.5 bg-white/80 rounded-full"
                                                onClick={(e) => { e.stopPropagation();
                                                    toggleWishlist(product.id); }}>
                                                <Heart className={`w-4 h-4 ${wishlist.includes(product.id) ? 'fill-red-500 text-red-500' : 'text-gray-600'}`} />
                                            </button>
                                        </div>
                                        <div className="p-2 flex flex-col flex-grow">
                                            <h4 className="text-[11px] font-bold text-gray-500 uppercase">{product.brand}</h4>
                                            <p className="text-xs text-gray-800 mt-0.5 line-clamp-1">{product.name}</p>
                                            <div className="mt-auto pt-2 flex items-baseline gap-1.5">
                                                <span className="text-sm font-bold text-gray-900">₹{product.price}</span>
                                                <span className="text-xs text-gray-400 line-through">₹{product.originalPrice}</span>
                                            </div>
                                            <div className="text-[10px] font-bold text-green-600 mt-0.5">
                                                {product.discount}% OFF
                                            </div>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );

            const renderProduct = () => {
                const [selectedSize, setSelectedSize] = useState('');
                if (!selectedProduct) return null;

                return (
                    <div className="bg-white min-h-screen pb-24 relative z-50">
                        <header className="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md shadow-sm flex items-center justify-between px-4 py-3 app-container">
                            <button onClick={() => setView('home')} className="p-1 -ml-1">
                                <ChevronLeft className="w-7 h-7 text-gray-800" />
                            </button>
                            <div className="flex gap-4">
                                <button onClick={() => alert('Share functionality')}>
                                    <Share2 className="w-6 h-6 text-gray-700" />
                                </button>
                                <button onClick={() => toggleWishlist(selectedProduct.id)}>
                                    <Heart className={`w-6 h-6 ${wishlist.includes(selectedProduct.id) ? 'fill-red-500 text-red-500' : 'text-gray-700'}`} />
                                </button>
                                <div className="relative cursor-pointer" onClick={() => setView('cart')}>
                                    <ShoppingBag className="w-6 h-6 text-gray-700" />
                                    {cart.length > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-yellow-400 text-black text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
                                            {cart.length}
                                        </span>
                                    )}
                                </div>
                            </div>
                        </header>

                        <div className="pt-14 app-container">
                            <div className="bg-gray-100 aspect-[4/5] md:aspect-[16/9] lg:aspect-[21/9] relative rounded-lg overflow-hidden my-4">
                                <img src={selectedProduct.images[0]} alt={selectedProduct.name} className="w-full h-full object-cover" />
                            </div>
                            <div className="p-4 md:p-6 lg:p-8 max-w-4xl mx-auto">
                                <h2 className="text-sm font-bold text-gray-500 uppercase tracking-wide">
                                    {selectedProduct.brand}
                                </h2>
                                <h1 className="text-lg md:text-2xl text-gray-800 mt-1 leading-tight">
                                    {selectedProduct.name}
                                </h1>

                                <div className="flex items-center gap-2 mt-3">
                                    <div className="flex items-center gap-1 bg-yellow-50 px-2 py-1 rounded border border-yellow-200">
                                        <Star className="w-4 h-4 text-yellow-600 fill-yellow-600" />
                                        <span className="text-sm font-bold text-yellow-800">{selectedProduct.rating}</span>
                                    </div>
                                    <span className="text-sm text-gray-500 underline">{selectedProduct.reviews} Reviews</span>
                                </div>

                                <div className="mt-4 flex items-baseline gap-2">
                                    <span className="text-2xl font-black text-gray-900">₹{selectedProduct.price}</span>
                                    <span className="text-sm text-gray-400 line-through">₹{selectedProduct.originalPrice}</span>
                                    <span className="text-sm font-bold text-green-600">{selectedProduct.discount}% OFF</span>
                                </div>
                                <p className="text-xs text-gray-500 mt-1">inclusive of all taxes</p>

                                <div className="w-full h-px bg-gray-200 my-5" />

                                <div>
                                    <div className="flex items-center justify-between mb-3">
                                        <h3 className="text-sm font-bold text-gray-900 uppercase">Select Size</h3>
                                        <button onClick={() => alert('Size Guide: S (38), M (40), L (42), XL (44), XXL (46)')}
                                            className="text-xs font-bold text-yellow-600 uppercase">
                                            Size Guide
                                        </button>
                                    </div>
                                    <div className="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
                                        {selectedProduct.sizes.map(size => (
                                            <button key={size} onClick={() => setSelectedSize(size)}
                                                className={`min-w-[3rem] h-12 rounded-full border-2 flex items-center justify-center text-sm font-bold transition-all ${
                                                    selectedSize === size
                                                        ? 'border-gray-900 bg-gray-900 text-white'
                                                        : 'border-gray-300 text-gray-700 bg-white'
                                                }`}>
                                                {size}
                                            </button>
                                        ))}
                                    </div>
                                    {!selectedSize && (
                                        <p className="text-xs text-red-500 mt-2 font-medium">Please select a size to continue</p>
                                    )}
                                </div>

                                <div className="mt-6 bg-gray-50 rounded-lg p-3 border border-gray-200">
                                    <div className="flex items-start gap-3">
                                        <Truck className="w-5 h-5 text-gray-600 mt-0.5" />
                                        <div>
                                            <h4 className="text-sm font-bold text-gray-900">Delivery & Return</h4>
                                            <p className="text-xs text-gray-600 mt-1">Enter your Pincode to check delivery time.</p>
                                            <div className="mt-2 flex flex-wrap">
                                                <input type="text" placeholder="Enter Pincode" id="pincode-input"
                                                    className="text-sm border border-gray-300 rounded-l px-3 py-1.5 w-full md:w-48 outline-none focus:border-yellow-400" />
                                                <button onClick={() => {
                                                        const pincode = document.getElementById('pincode-input').value;
                                                        if (pincode.length === 6) {
                                                            alert(`Delivery available to ${pincode}! Expected 3-5 days.`);
                                                        } else {
                                                            alert('Please enter a valid 6-digit pincode.');
                                                        }
                                                    }}
                                                    className="bg-gray-200 text-gray-800 px-3 py-1.5 rounded-r text-sm font-bold">
                                                    CHECK
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 flex p-3 gap-3 z-50 app-container">
                            <button className="w-1/3 md:w-1/4 flex items-center justify-center border-2 border-gray-300 rounded font-bold text-gray-700 h-12 active:bg-gray-50"
                                onClick={() => toggleWishlist(selectedProduct.id)}>
                                <Heart className={`w-5 h-5 mr-2 ${wishlist.includes(selectedProduct.id) ? 'fill-red-500 text-red-500' : ''}`} />
                                WISHLIST
                            </button>
                            <button className={`w-2/3 md:w-3/4 flex items-center justify-center rounded font-bold h-12 transition-colors ${
                                    selectedSize
                                        ? 'bg-yellow-400 text-black active:bg-yellow-500'
                                        : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                }`}
                                onClick={() => selectedSize && addToCart(selectedProduct, selectedSize)}>
                                <ShoppingBag className="w-5 h-5 mr-2" />
                                ADD TO BAG
                            </button>
                        </div>
                    </div>
                );
            };

            const renderCart = () => {
                const totalMRP = cart.reduce((sum, item) => sum + (item.product.originalPrice * item.qty), 0);
                const totalDiscount = cart.reduce((sum, item) => sum + ((item.product.originalPrice - item.product.price) * item.qty), 0);
                const finalTotal = totalMRP - totalDiscount;

                return (
                    <div className="bg-gray-50 min-h-screen pb-24">
                        <header className="sticky top-0 w-full z-50 bg-white shadow-sm flex items-center px-4 py-4 app-container">
                            <button onClick={() => setView('home')} className="p-1 -ml-1 mr-3">
                                <ChevronLeft className="w-6 h-6 text-gray-800" />
                            </button>
                            <h1 className="text-lg font-bold text-gray-900">Bag ({cart.length} items)</h1>
                        </header>

                        {cart.length === 0 ? (
                            <div className="flex flex-col items-center justify-center pt-32 px-6 text-center">
                                <div className="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center mb-6">
                                    <ShoppingBag className="w-10 h-10 text-yellow-600" />
                                </div>
                                <h2 className="text-xl font-bold text-gray-900">Nothing in the bag</h2>
                                <p className="text-gray-500 mt-2 text-sm">Add some amazing designs to your cart to checkout.</p>
                                <button onClick={() => setView('home')}
                                    className="mt-8 border-2 border-yellow-400 text-yellow-600 font-bold px-8 py-3 rounded uppercase text-sm w-full sm:w-auto">
                                    Continue Shopping
                                </button>
                            </div>
                        ) : (
                            <div className="p-3 app-container">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="space-y-3">
                                        {cart.map((item, index) => (
                                            <div key={index} className="bg-white rounded p-3 flex gap-3 shadow-sm border border-gray-100">
                                                <div className="w-24 h-32 flex-shrink-0 bg-gray-100 rounded overflow-hidden">
                                                    <img src={item.product.image} alt={item.product.name} className="w-full h-full object-cover" />
                                                </div>
                                                <div className="flex flex-col flex-grow">
                                                    <div className="flex justify-between items-start">
                                                        <h3 className="text-sm text-gray-800 pr-4 line-clamp-2">{item.product.name}</h3>
                                                        <button onClick={() => updateCartQty(index, -item.qty)} className="text-gray-400 p-1 -mr-1 -mt-1">
                                                            <X className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                    <div className="mt-1 flex items-baseline gap-2">
                                                        <span className="text-lg font-bold text-gray-900">₹{item.product.price}</span>
                                                        <span className="text-xs text-gray-400 line-through">₹{item.product.originalPrice}</span>
                                                    </div>
                                                    <div className="mt-2 text-xs text-gray-600 font-medium">Size: <span
                                                        className="font-bold text-gray-900">{item.size}</span></div>

                                                    <div className="mt-auto flex items-center gap-4">
                                                        <div className="flex items-center border border-gray-300 rounded">
                                                            <button onClick={() => updateCartQty(index, -1)} className="px-2 py-1 bg-gray-50 active:bg-gray-200">
                                                                <Minus className="w-3 h-3" />
                                                            </button>
                                                            <span className="px-3 text-sm font-bold">{item.qty}</span>
                                                            <button onClick={() => updateCartQty(index, 1)} className="px-2 py-1 bg-gray-50 active:bg-gray-200">
                                                                <Plus className="w-3 h-3" />
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="bg-white rounded p-4 shadow-sm border border-gray-100 h-fit sticky top-20">
                                        <h3 className="font-bold text-gray-900 mb-4 uppercase text-sm tracking-wide">Price Summary</h3>
                                        <div className="space-y-3 text-sm">
                                            <div className="flex justify-between text-gray-600">
                                                <span>Total MRP (Incl. of taxes)</span>
                                                <span>₹{totalMRP}</span>
                                            </div>
                                            <div className="flex justify-between text-green-600">
                                                <span>Bag Discount</span>
                                                <span>- ₹{totalDiscount}</span>
                                            </div>
                                            <div className="flex justify-between text-gray-600">
                                                <span>Delivery Fee</span>
                                                <span className="text-green-600 font-bold">FREE</span>
                                            </div>
                                            <div className="h-px bg-gray-200 my-2" />
                                            <div className="flex justify-between text-base font-black text-gray-900">
                                                <span>Subtotal</span>
                                                <span>₹{finalTotal}</span>
                                            </div>
                                            <div className="bg-green-50 text-green-700 text-xs font-bold p-2 rounded text-center mt-2 border border-green-100">
                                                You are saving ₹{totalDiscount} on this order!
                                            </div>
                                        </div>
                                        <button onClick={() => { alert('Proceeding to checkout with ' + cart.length + ' items!');
                                                setCart([]);
                                                setView('home'); }}
                                            className="mt-4 w-full bg-yellow-400 text-black font-bold py-3 rounded uppercase shadow-sm active:bg-yellow-500">
                                            Continue
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const renderWishlist = () => {
                const wishlistItems = PRODUCTS.filter(p => wishlist.includes(p.id));
                return (
                    <div className="bg-gray-50 min-h-screen pb-20">
                        <header className="sticky top-0 w-full z-50 bg-white shadow-sm flex items-center px-4 py-4 app-container">
                            <button onClick={() => setView('home')} className="p-1 -ml-1 mr-3">
                                <ChevronLeft className="w-6 h-6 text-gray-800" />
                            </button>
                            <h1 className="text-lg font-bold text-gray-900">Wishlist ({wishlist.length})</h1>
                        </header>
                        {wishlistItems.length === 0 ? (
                            <div className="flex flex-col items-center justify-center pt-32 px-6 text-center">
                                <Heart className="w-16 h-16 text-gray-300 mb-4" />
                                <h2 className="text-xl font-bold text-gray-900">No favourites yet</h2>
                                <p className="text-gray-500 mt-2 text-sm">Start adding items you love to your wishlist.</p>
                                <button onClick={() => setView('home')}
                                    className="mt-8 border-2 border-yellow-400 text-yellow-600 font-bold px-8 py-3 rounded uppercase text-sm w-full sm:w-auto">
                                    Explore Products
                                </button>
                            </div>
                        ) : (
                            <div className="p-3 app-container grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                                {wishlistItems.map(product => (
                                    <div key={product.id}
                                        className="bg-white rounded-md overflow-hidden shadow-sm border border-gray-100 flex flex-col cursor-pointer hover:shadow-md"
                                        onClick={() => { setSelectedProduct(product);
                                            setView('product'); }}>
                                        <div className="relative aspect-[3/4] bg-gray-100">
                                            <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
                                            <button className="absolute top-2 right-2 p-1.5 bg-white/80 rounded-full"
                                                onClick={(e) => { e.stopPropagation();
                                                    toggleWishlist(product.id); }}>
                                                <Heart className="w-4 h-4 fill-red-500 text-red-500" />
                                            </button>
                                        </div>
                                        <div className="p-2">
                                            <h4 className="text-[11px] font-bold text-gray-500 uppercase">{product.brand}</h4>
                                            <p className="text-xs text-gray-800 mt-0.5 line-clamp-1">{product.name}</p>
                                            <div className="mt-1 flex items-baseline gap-1.5">
                                                <span className="text-sm font-bold text-gray-900">₹{product.price}</span>
                                                <span className="text-xs text-gray-400 line-through">₹{product.originalPrice}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                );
            };

            const renderProfile = () => (
                <div className="bg-gray-50 min-h-screen pb-20">
                    <header className="sticky top-0 w-full z-50 bg-white shadow-sm flex items-center px-4 py-4 app-container">
                        <button onClick={() => setView('home')} className="p-1 -ml-1 mr-3">
                            <ChevronLeft className="w-6 h-6 text-gray-800" />
                        </button>
                        <h1 className="text-lg font-bold text-gray-900">Profile</h1>
                    </header>
                    <div className="p-6 flex flex-col items-center max-w-md mx-auto">
                        <div className="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center text-4xl font-bold text-yellow-600 mb-4">
                            R
                        </div>
                        <h2 className="text-xl font-bold">Rabiul User</h2>
                        <p className="text-gray-500">rabiul@example.com</p>
                        <div className="w-full mt-8 bg-white rounded-lg shadow-sm p-4 border border-gray-100 space-y-4">
                            <div className="flex justify-between"><span className="text-gray-600">Orders</span><span className="font-bold">12</span></div>
                            <div className="flex justify-between"><span className="text-gray-600">Wishlist</span><span className="font-bold">{wishlist.length}</span></div>
                            <div className="flex justify-between"><span className="text-gray-600">Cart items</span><span className="font-bold">{cart.length}</span></div>
                        </div>
                        <button onClick={() => { alert('Logged out!'); setView('home'); }}
                            className="mt-8 bg-red-500 text-white font-bold py-3 px-12 rounded-full shadow-sm active:bg-red-600">
                            Logout
                        </button>
                    </div>
                </div>
            );

            // --- BOTTOM NAV ---
            const renderBottomNav = () => (
                <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 pb-safe z-40">
                    <div className="app-container flex justify-between px-6">
                        <button onClick={() => setView('home')} className="flex flex-col items-center p-1 text-yellow-500">
                            <Home className="w-6 h-6" />
                            <span className="text-[10px] font-bold mt-1">Home</span>
                        </button>
                        <button onClick={() => { setView('home'); document.querySelector('.bg-white.py-4')?.scrollIntoView({ behavior: 'smooth' }); }}
                            className="flex flex-col items-center p-1 text-gray-400">
                            <Grid className="w-6 h-6" />
                            <span className="text-[10px] font-medium mt-1">Categories</span>
                        </button>
                        <button onClick={() => setView('wishlist')} className="flex flex-col items-center p-1 text-gray-400 relative">
                            <Heart className="w-6 h-6" />
                            {wishlist.length > 0 && (
                                <span className="absolute top-0 right-1 w-2 h-2 bg-yellow-400 rounded-full"></span>
                            )}
                            <span className="text-[10px] font-medium mt-1">Wishlist</span>
                        </button>
                        <button onClick={() => setView('profile')} className="flex flex-col items-center p-1 text-gray-400">
                            <User className="w-6 h-6" />
                            <span className="text-[10px] font-medium mt-1">Profile</span>
                        </button>
                    </div>
                </nav>
            );

            // --- RENDER SWITCH ---
            let content;
            if (view === 'home') content = renderHome();
            else if (view === 'product') content = renderProduct();
            else if (view === 'cart') content = renderCart();
            else if (view === 'wishlist') content = renderWishlist();
            else if (view === 'profile') content = renderProfile();

            return (
                <div className="bg-white min-h-screen shadow-2xl font-sans text-gray-900 antialiased overflow-x-hidden">
                    {content}
                    {(view === 'home' || view === 'wishlist' || view === 'profile') && renderBottomNav()}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
